# Frontend en Netlify (sitio estático + CDN).
# Variable a configurar en Netlify → Site settings → Environment variables:
#   API_URL = https://<tu-api>.up.railway.app   (la URL pública de la API en Railway, sin "/" al final)
# Con eso el build genera dist/_redirects y Netlify redirige /api/* a Railway: el navegador ve un solo dominio,
# las cookies de sesión funcionan sin configuración entre sitios y no hace falta CORS.
[build]
  base = "client"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: todas las rutas las resuelve React Router (las de /api/* van antes, en _redirects).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets con hash: caché de 1 año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML siempre fresco para que las actualizaciones lleguen al instante.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
