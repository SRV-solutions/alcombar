# Frontend en Netlify (sitio estático + CDN). En Netlify: Base directory = client.
# Netlify redirige /api/* a la API en Railway: el navegador ve un solo dominio,
# las cookies httpOnly funcionan sin configuración entre sitios y no hace falta CORS.
# Si se define API_URL en Netlify, el build genera dist/_redirects con esa URL y tiene prioridad sobre la de acá.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://alcombar-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA: todas las demás rutas las resuelve React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets con hash: caché de 1 año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML siempre fresco para que las actualizaciones lleguen al instante.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
