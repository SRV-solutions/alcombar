# Despliegue del front en Netlify (después del MVP). En Netlify: Base directory = client.
# Netlify redirige /api/* a la API en Railway: el navegador ve un solo dominio,
# las cookies httpOnly funcionan sin configuración entre sitios y no hace falta CORS.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://REEMPLAZAR-POR-LA-URL-DE-RAILWAY.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
